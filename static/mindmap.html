<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni Mindmap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --grn: #39ff6a; --grn-dim: #4a9a5a; --grn-deep: #1e3a1e;
    --red: #ff5555; --amb: #ffb86c; --pur: #bc8cff; --wht: #e6e6e6;
    --bg: #000;
  }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--grn); font: 12px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
        background: radial-gradient(ellipse at 50% 40%, #04140a 0%, #000 70%); cursor: grab; }
  #cv.drag { cursor: grabbing; }

  .panel { position: fixed; background: rgba(0,0,0,.82); border: 1px solid var(--grn-deep);
           box-shadow: 0 0 14px rgba(57,255,106,.12); backdrop-filter: blur(3px); z-index: 20; }

  #hud { top: 16px; left: 16px; padding: 12px 14px; width: 288px; }
  #hud h1 { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px;
            color: var(--grn); text-shadow: 0 0 6px rgba(57,255,106,.6); }
  #hud h1 .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #stats { color: var(--grn-dim); font-size: 11px; margin-bottom: 9px; }
  #search { width: 100%; background: #000; border: 1px solid var(--grn-deep); color: var(--grn);
            font: 12px ui-monospace, monospace; padding: 6px 8px; outline: none; }
  #search:focus { border-color: var(--grn); box-shadow: 0 0 8px rgba(57,255,106,.25); }
  #search::placeholder { color: var(--grn-dim); opacity: .7; }
  #results { margin-top: 6px; max-height: 210px; overflow-y: auto; display: none; }
  #results.on { display: block; }
  #results div { padding: 3px 6px; color: var(--grn-dim); cursor: pointer; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
  #results div:hover, #results div.sel { color: var(--grn); border-left-color: var(--grn); background: rgba(57,255,106,.06); }
  #results .t { color: #2f5f3a; font-size: 10px; }

  #detail { top: 16px; right: 16px; width: 300px; padding: 13px 15px; display: none; }
  #detail.on { display: block; }
  #detail .close { position: absolute; top: 8px; right: 11px; color: var(--grn-dim); cursor: pointer; font-size: 14px; }
  #detail .close:hover { color: var(--grn); }
  #detail .kicker { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--grn-dim); }
  #detail h2 { font-size: 15px; color: var(--grn); margin: 3px 0 10px; line-height: 1.35;
               text-shadow: 0 0 6px rgba(57,255,106,.4); overflow-wrap: anywhere; }
  #detail .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; color: var(--grn-dim); }
  #detail .row b { color: var(--wht); font-weight: normal; }
  #detail .pos { color: var(--grn); } #detail .neg { color: var(--red); } #detail .neu { color: var(--amb); }
  #detail .warm { margin-top: 10px; }
  #detail .warm .bar { height: 5px; background: var(--grn-deep); margin-top: 4px; overflow: hidden; }
  #detail .warm .bar i { display: block; height: 100%; background: var(--grn); box-shadow: 0 0 8px var(--grn); }
  #detail .conn { margin-top: 11px; border-top: 1px solid var(--grn-deep); padding-top: 9px; }
  #detail .conn .h { color: var(--grn-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  #detail .chip { display: inline-block; color: var(--grn-dim); border: 1px solid var(--grn-deep);
                  padding: 2px 7px; margin: 0 4px 4px 0; cursor: pointer; font-size: 11px; border-radius: 2px; }
  #detail .chip:hover { color: var(--grn); border-color: var(--grn); }

  #legend { bottom: 14px; right: 16px; padding: 9px 13px; color: var(--grn-dim); font-size: 11px; }
  #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  #legend .hint { margin-top: 7px; color: #2f5f3a; }

  #ctl { bottom: 14px; left: 16px; padding: 5px; display: flex; gap: 5px; }
  #ctl button { background: #000; color: var(--grn-dim); border: 1px solid var(--grn-deep);
                width: 30px; height: 30px; font: 15px monospace; cursor: pointer; border-radius: 2px; }
  #ctl button:hover { color: var(--grn); border-color: var(--grn); }
  #ctl button.wide { width: auto; padding: 0 11px; font-size: 11px; letter-spacing: .5px; }

  #tooltip { position: fixed; display: none; padding: 6px 10px; z-index: 30; pointer-events: none;
             background: rgba(0,0,0,.9); border: 1px solid var(--grn-deep); color: var(--grn);
             font: 11px monospace; max-width: 300px; box-shadow: 0 0 10px rgba(57,255,106,.2); }
  #tooltip b { color: var(--grn); text-shadow: 0 0 4px rgba(57,255,106,.5); }

  @media (max-width: 640px) {
    #hud { width: calc(100vw - 32px); } #detail { display: none !important; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="panel">
  <h1>&gt; omni mindmap<span class="cursor">_</span></h1>
  <div id="stats">loading…</div>
  <input id="search" placeholder="search fields, tasks, domains…" autocomplete="off" spellcheck="false">
  <div id="results"></div>
</div>

<div id="detail" class="panel">
  <span class="close" id="detailClose">×</span>
  <div class="kicker" id="dKicker"></div>
  <h2 id="dTitle"></h2>
  <div id="dRows"></div>
  <div class="warm">
    <div class="row"><span>warmth · recency</span><b id="dWarmTxt"></b></div>
    <div class="bar"><i id="dWarmBar"></i></div>
  </div>
  <div class="conn" id="dConn"></div>
</div>

<div id="legend" class="panel">
  <div><span class="dot" style="background:#3fb950"></span>growing (28d)</div>
  <div><span class="dot" style="background:#d29922"></span>holding steady</div>
  <div><span class="dot" style="background:#e5534b"></span>slipping</div>
  <div><span class="dot" style="background:#bc8cff"></span>agent task</div>
  <div class="hint">bright = touched recently · dim = dormant<br>hover to trace · click to focus · dashed = cross-field bridge</div>
</div>

<div id="ctl" class="panel">
  <button id="zin" title="zoom in">+</button>
  <button id="zout" title="zoom out">−</button>
  <button id="reset" class="wide" title="reset view">reset</button>
</div>

<div id="tooltip"></div>

<script>
"use strict";
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const tip = document.getElementById('tooltip');
let W = 0, H = 0, DPR = 1;

// ---- data ----
let NODES = [], EDGES = [], BY = new Map();
const nbr = new Map();      // id -> Set of neighbor ids
const inc = new Map();      // id -> [edges]
let bounds = { minx: -1, miny: -1, maxx: 1, maxy: 1 };

// ---- camera ----
const cam = { x: 0, y: 0, z: 1 };            // current
const target = { x: 0, y: 0, z: 1 };         // animated toward
let animating = false;
const MINZ = 0.12, MAXZ = 6.5;

// ---- interaction state ----
let hoverId = null, selectId = null;
let searchSet = null;                        // Set of ids matched by search (or null)
let active = null;                           // Set of currently-emphasized ids (or null = all normal)

// ---------- visual encoding ----------
const TIER_R   = { 0: 11, 1: 8.5, 2: 5.2, 3: 3.1, 4: 3.0 };
const TIER_FONT= { 0: 13, 1: 14, 2: 12, 3: 10.5, 4: 10 };
// min zoom at which a tier's label appears (unless node is in the active set)
const TIER_LOD = { 0: 0, 1: 0, 2: 0.34, 3: 0.72, 4: 1.5 };

const SCORE_RGB = { green: [63,185,80], amber: [210,153,34], red: [229,83,75] };
function pointColor(n) {
  // growth-score driven color (SPEC-growth-system-revamp-2026-08)
  if (n.score_color && SCORE_RGB[n.score_color]) {
    if (n.type === 'task' && n.assigned_type === 'agent') return [188,140,255];
    return SCORE_RGB[n.score_color];
  }
  if (n.type === 'task') {
    if (n.assigned_type === 'agent') return [188,140,255];
    if (n.points > 10) return [63,185,80];
    if (n.points < 0)  return [229,83,75];
    return [210,153,34];
  }
  if (n.type === 'center') return [230,230,230];
  if (n.type === 'domain') return [57,255,106];
  if (n.points < 0) return [229,83,75];
  return [57,255,106];
}
function nodeRadius(n) {
  let r = TIER_R[n.tier] ?? 3;
  if (n.tier === 2) r += Math.min(4, Math.log2(1 + (n.task_count||0)) * 0.9);
  if (n.tier === 3) r += Math.min(2, Math.log2(1 + (n.task_count||0)) * 0.5);
  // size by windowed activity volume, not debt
  if (n.window_completions) r += Math.min(5, Math.log2(1 + n.window_completions) * 0.9);
  return r;
}

// ---------- transforms ----------
const w2sx = wx => (wx - cam.x) * cam.z + W / 2;
const w2sy = wy => (wy - cam.y) * cam.z + H / 2;
const s2wx = sx => (sx - W / 2) / cam.z + cam.x;
const s2wy = sy => (sy - H / 2) / cam.z + cam.y;

// ---------- layout ----------
// Replace the sparse server PCA positions with a radial tree + spring-electrical
// relaxation: center anchor, domains ring it, each domain's fields cluster
// nearby, subfields/tasks hang off their parents, cross edges bridge fields.
// Fills the middle, kills the crisscrossing long edges, keeps the graph story.
function computeLayout() {
  const parentOf = new Map(), kids = new Map();
  for (const n of NODES) kids.set(n.id, []);
  // spanning tree from edges (hierarchy = parent→child, core = center→domain, membership = task→tag)
  for (const e of EDGES) {
    if (e.kind === 'hierarchy' || e.kind === 'core') {
      if (!parentOf.has(e.target)) { parentOf.set(e.target, e.source); kids.get(e.source).push(e.target); }
    }
  }
  for (const e of EDGES) {
    if (e.kind === 'membership' && !parentOf.has(e.source)) {
      parentOf.set(e.source, e.target); kids.get(e.target).push(e.source);
    }
  }
  const RING = { 0: 0, 1: 230, 2: 150, 3: 78, 4: 46 };  // radius from parent by tier
  const place = (id, cx, cy, a0, a1) => {
    const n = BY.get(id);
    const depth = n.tier || 0;
    if (id === '__you') { n.x = 0; n.y = 0; }
    else {
      const a = (a0 + a1) / 2;
      const par = BY.get(parentOf.get(id));
      const px = par ? par.x : 0, py = par ? par.y : 0;
      n.x = px + Math.cos(a) * RING[depth];
      n.y = py + Math.sin(a) * RING[depth];
    }
    const ch = kids.get(id);
    if (!ch.length) return;
    // give each child an angular slice, weighted by its own subtree size
    const sizes = ch.map(c => subtreeSize(c, kids));
    const total = sizes.reduce((s, v) => s + v, 0) || 1;
    // widen the slice for deeper levels so leaves fan out
    let span = a1 - a0; if (id === '__you') span = Math.PI * 2;
    else span = Math.min(span, Math.PI * 1.15);
    let a = a0 === undefined ? -Math.PI : (a0);
    if (id === '__you') a = 0;
    let cur = a;
    for (let i = 0; i < ch.length; i++) {
      const slice = span * (sizes[i] / total);
      place(ch[i], n.x, n.y, cur, cur + slice);
      cur += slice;
    }
  };
  place('__you', 0, 0, 0, Math.PI * 2);

  // any orphans (no tree path) get parked on an outer ring
  let oi = 0;
  const orphans = NODES.filter(n => n.id !== '__you' && !parentOf.has(n.id));
  for (const n of orphans) { const a = (oi++ / Math.max(1, orphans.length)) * 6.2832; n.x = Math.cos(a) * 620; n.y = Math.sin(a) * 620; }

  // ---- spring-electrical relaxation (Fruchterman–Reingold flavored) ----
  const P = NODES.map(n => [n.x, n.y]);
  const idx = new Map(NODES.map((n, i) => [n.id, i]));
  const K = 92;                         // ideal separation
  const springs = [];
  for (const e of EDGES) {
    const u = idx.get(e.source), v = idx.get(e.target);
    if (u == null || v == null) continue;
    const w = e.kind === 'cross' ? 0.12 : e.kind === 'membership' ? 0.45
            : e.kind === 'core' ? 1.0 : 0.9;
    springs.push([u, v, w]);
  }
  let t = 140;
  for (let it = 0; it < 420; it++) {
    const disp = NODES.map(() => [0, 0]);
    for (let i = 0; i < P.length; i++) {
      for (let j = i + 1; j < P.length; j++) {
        let dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1];
        let d2 = dx * dx + dy * dy; if (d2 < 0.01) { d2 = 0.01; dx = Math.random(); dy = Math.random(); }
        const d = Math.sqrt(d2);
        const f = (K * K) / d2 * 12;     // repulsion
        const fx = (dx / d) * f, fy = (dy / d) * f;
        disp[i][0] += fx; disp[i][1] += fy; disp[j][0] -= fx; disp[j][1] -= fy;
      }
    }
    for (const [u, v, w] of springs) {
      const dx = P[v][0] - P[u][0], dy = P[v][1] - P[u][1];
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d * d) / K * 0.0009 * w;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      disp[u][0] += fx; disp[u][1] += fy; disp[v][0] -= fx; disp[v][1] -= fy;
    }
    for (let i = 0; i < P.length; i++) {
      if (NODES[i].id === '__you') continue;          // pin center
      disp[i][0] -= P[i][0] * 0.012; disp[i][1] -= P[i][1] * 0.012;   // gravity to origin
      const dl = Math.hypot(disp[i][0], disp[i][1]) || 1;
      P[i][0] += (disp[i][0] / dl) * Math.min(dl, t);
      P[i][1] += (disp[i][1] / dl) * Math.min(dl, t);
    }
    t = Math.max(4, t * 0.985);
  }
  for (let i = 0; i < NODES.length; i++) { NODES[i].x = Math.round(P[i][0] * 10) / 10; NODES[i].y = Math.round(P[i][1] * 10) / 10; }
}
function subtreeSize(id, kids, seen) {
  seen = seen || new Set(); if (seen.has(id)) return 1; seen.add(id);
  let s = 1; for (const c of kids.get(id) || []) s += subtreeSize(c, kids, seen);
  return s;
}

// ---------- load ----------
async function load() {
  const g = await (await fetch('/static/graph.json?v=' + Date.now())).json();
  NODES = g.nodes; EDGES = g.edges;

  // synthetic center "you" anchor at the centroid of the domains
  const doms = NODES.filter(n => n.type === 'domain');
  const cx = doms.reduce((s, n) => s + n.x, 0) / (doms.length || 1);
  const cy = doms.reduce((s, n) => s + n.y, 0) / (doms.length || 1);
  const warm = Math.max(0, ...doms.map(n => n.warmth || 0));
  const center = { id: '__you', label: 'satyam', tier: 0, type: 'center',
                   x: cx, y: cy, warmth: warm, task_count: doms.length };
  NODES.unshift(center);
  for (const d of doms) EDGES.push({ source: '__you', target: d.id, kind: 'core', weight: 1 });

  for (const n of NODES) { BY.set(n.id, n); nbr.set(n.id, new Set()); inc.set(n.id, []); }
  for (const e of EDGES) {
    if (!BY.has(e.source) || !BY.has(e.target)) continue;
    nbr.get(e.source).add(e.target); nbr.get(e.target).add(e.source);
    inc.get(e.source).push(e); inc.get(e.target).push(e);
  }

  computeLayout();

  // bounds from structural nodes (ignore far task jitter for framing)
  const fr = NODES.filter(n => n.tier <= 3);
  bounds.minx = Math.min(...fr.map(n => n.x)); bounds.maxx = Math.max(...fr.map(n => n.x));
  bounds.miny = Math.min(...fr.map(n => n.y)); bounds.maxy = Math.max(...fr.map(n => n.y));

  // stats
  const t = NODES.filter(n => n.type === 'task').length;
  const f = NODES.filter(n => n.type === 'field' || n.type === 'subfield').length;
  const b = EDGES.filter(e => e.kind === 'cross').length;
  document.getElementById('stats').textContent =
    `${doms.length} domains · ${f} fields · ${t} tasks · ${b} bridges`;

  resize();
  fitAll(false);
  requestAnimationFrame(frame);
}

// ---------- camera helpers ----------
function fitBounds(bx, animate = true) {
  const pad = 90;
  const zx = (W - pad * 2) / Math.max(1, bx.maxx - bx.minx);
  const zy = (H - pad * 2) / Math.max(1, bx.maxy - bx.miny);
  const z = Math.max(MINZ, Math.min(MAXZ, Math.min(zx, zy)));
  flyTo((bx.minx + bx.maxx) / 2, (bx.miny + bx.maxy) / 2, z, animate);
}
function fitAll(animate = true) { fitBounds(bounds, animate); }
function flyTo(x, y, z, animate = true) {
  target.x = x; target.y = y; target.z = Math.max(MINZ, Math.min(MAXZ, z));
  if (animate) { animating = true; }
  else { cam.x = x; cam.y = y; cam.z = target.z; }
}

// ---------- active / focus set ----------
function neighborhood(id) {
  const s = new Set([id]);
  for (const nb of nbr.get(id) || []) s.add(nb);
  return s;
}
function recomputeActive() {
  if (selectId) active = neighborhood(selectId);
  else if (hoverId) active = neighborhood(hoverId);
  else if (searchSet && searchSet.size) active = searchSet;
  else active = null;
}

// ---------- render ----------
function frame() {
  // ease camera
  const dx = target.x - cam.x, dy = target.y - cam.y, dz = target.z - cam.z;
  if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4 || Math.abs(dz) > 0.0008) {
    cam.x += dx * 0.16; cam.y += dy * 0.16; cam.z += dz * 0.16;
  } else if (animating) { cam.x = target.x; cam.y = target.y; cam.z = target.z; animating = false; }
  draw();
  requestAnimationFrame(frame);
}

function alphaFor(id) {
  if (!active) return 1;
  return active.has(id) ? 1 : 0.1;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const z = cam.z;

  // ---- edges ----
  ctx.lineCap = 'round';
  for (const e of EDGES) {
    const a = BY.get(e.source), b = BY.get(e.target);
    if (!a || !b) continue;
    const act = active && (active.has(a.id) && active.has(b.id));
    const endActive = active && (active.has(a.id) || active.has(b.id));

    // LOD: hide low-value edges when far / not relevant
    if (e.kind === 'membership' && !endActive && z < 1.3) continue;
    if (e.kind === 'cross' && !endActive && z < 0.4) continue;

    let col, wdt, alpha, dash = null;
    if (e.kind === 'cross') { col = '57,255,106'; wdt = 0.6 + Math.min(2.4, (e.weight||1) * 0.5); alpha = 0.5; dash = [5, 5]; }
    else if (e.kind === 'core') { col = '74,154,90'; wdt = 1; alpha = 0.4; }
    else if (e.kind === 'membership') { col = '30,70,40'; wdt = 0.7; alpha = 0.5; }
    else { col = '40,110,58'; wdt = 0.8; alpha = 0.55; } // hierarchy

    if (active) alpha = act ? Math.min(1, alpha + 0.45) : (endActive ? alpha * 0.5 : 0.04);
    if (alpha < 0.02) continue;

    ctx.beginPath();
    ctx.moveTo(w2sx(a.x), w2sy(a.y));
    ctx.lineTo(w2sx(b.x), w2sy(b.y));
    ctx.strokeStyle = `rgba(${col},${alpha})`;
    ctx.lineWidth = act ? wdt + 0.6 : wdt;
    ctx.setLineDash(dash || []);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // ---- nodes ----
  for (const n of NODES) {
    const sx = w2sx(n.x), sy = w2sy(n.y);
    if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;
    // task LOD: only render task dots when zoomed in or in active set
    if (n.tier === 4 && z < 1.2 && !(active && active.has(n.id))) continue;

    const a = alphaFor(n.id);
    if (a < 0.02) continue;
    const [r, g, bl] = pointColor(n);
    const rad = Math.max(1.5, nodeRadius(n) * Math.min(1.7, 0.7 + z * 0.22));
    const warm = n.warmth ?? 0.5;
    const isActive = active && active.has(n.id);
    const isHot = n.id === hoverId || n.id === selectId;

    // glow — warmth-driven, boosted for active
    const glow = (6 + warm * 16) * (isActive ? 1.4 : 1) * (isHot ? 1.6 : 1);
    ctx.shadowColor = `rgba(${r},${g},${bl},${(0.35 + warm * 0.5) * a})`;
    ctx.shadowBlur = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, rad, 0, 6.2832);
    ctx.fillStyle = `rgba(${r},${g},${bl},${(0.5 + warm * 0.45) * a})`;
    ctx.fill();
    ctx.shadowBlur = 0;

    // bright core
    ctx.beginPath();
    ctx.arc(sx, sy, rad * 0.5, 0, 6.2832);
    ctx.fillStyle = `rgba(${Math.min(255, r + 90)},${Math.min(255, g + 60)},${Math.min(255, bl + 90)},${a})`;
    ctx.fill();

    // selection / hover ring
    if (isHot) {
      ctx.beginPath();
      ctx.arc(sx, sy, rad + 4.5, 0, 6.2832);
      ctx.strokeStyle = `rgba(${r},${g},${bl},0.9)`;
      ctx.lineWidth = 1.4; ctx.stroke();
    }
  }

  // ---- labels (screen-space, fixed size, collision-culled) ----
  drawLabels(z);
}

function drawLabels(z) {
  // priority: active nodes first, then by tier (domains>fields>subfields>tasks),
  // then by importance (task_count). Higher priority claims screen space first.
  const cand = [];
  for (const n of NODES) {
    const sx = w2sx(n.x), sy = w2sy(n.y);
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    const inActive = active && active.has(n.id);
    if (!inActive) {
      if (active && !active.has(n.id)) {
        // when something is focused, only label the focused set (keeps it clean)
        if (active.size <= 40) continue;
      }
      if (z < (TIER_LOD[n.tier] ?? 2)) continue;   // LOD gate
    }
    const pr = (inActive ? 0 : 10) + n.tier * 2 - Math.min(1.9, Math.log2(1 + (n.task_count || 0)) * 0.4);
    cand.push({ n, sx, sy, pr, inActive });
  }
  cand.sort((a, b) => a.pr - b.pr);

  const placed = [];
  const hit = (x, y, w, h) => {
    for (const r of placed)
      if (x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y) return true;
    return false;
  };

  for (const c of cand) {
    const n = c.n;
    const fs = TIER_FONT[n.tier] ?? 10;
    const bold = n.tier <= 1;
    ctx.font = `${bold ? '700 ' : ''}${fs}px ui-monospace, monospace`;
    let text = n.label;
    if (n.tier === 4 && text.length > 34) text = text.slice(0, 33) + '…';
    const tw = ctx.measureText(text).width;
    const rad = Math.max(1.5, nodeRadius(n) * Math.min(1.7, 0.7 + z * 0.22));

    // place to the right of the dot; domains/center centered-right with a pill
    const padx = 5, lx = c.sx + rad + padx, ly = c.sy;
    const boxW = tw + (n.tier <= 1 ? 12 : 4), boxH = fs + 6;
    const bx = lx - 2, by = ly - boxH / 2;

    if (!c.inActive && hit(bx, by, boxW, boxH)) continue;   // collision cull
    placed.push({ x: bx, y: by, w: boxW, h: boxH });

    const a = c.inActive ? 1 : alphaFor(n.id);
    const [r, g, bl] = n.type === 'task' ? pointColor(n)
                     : (n.tier <= 1 ? [57,255,106]          // domains + center: always green
                     : (n.points < 0 ? [229,83,75] : [90,200,120]));
    const dimmed = active && !c.inActive;

    // pill behind prominent / active labels for contrast
    if (n.tier <= 1 || c.inActive) {
      ctx.fillStyle = `rgba(0,0,0,${0.62 * a})`;
      roundRect(bx, by, boxW, boxH, 3); ctx.fill();
      if (n.tier <= 1) {
        ctx.strokeStyle = `rgba(${r},${g},${bl},${0.55 * a})`;
        ctx.lineWidth = 1; roundRect(bx, by, boxW, boxH, 3); ctx.stroke();
      }
    }

    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const disp = n.tier === 1 ? `[${text.toUpperCase()}]` : (n.tier === 0 ? text : text);
    if (n.tier <= 1) { ctx.shadowColor = `rgba(${r},${g},${bl},${0.6*a})`; ctx.shadowBlur = 7; }
    ctx.fillStyle = dimmed ? `rgba(${r},${g},${bl},0.28)` : `rgba(${r},${g},${bl},${a})`;
    ctx.fillText(disp, n.tier <= 1 ? lx + 4 : lx, ly + 0.5);
    ctx.shadowBlur = 0;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- hit testing ----------
function pick(sx, sy) {
  let best = null, bestD = 22 * 22;   // px radius, squared
  for (const n of NODES) {
    if (n.tier === 4 && cam.z < 1.2 && !(active && active.has(n.id))) continue;
    const dx = w2sx(n.x) - sx, dy = w2sy(n.y) - sy;
    const rad = Math.max(1.5, nodeRadius(n) * Math.min(1.7, 0.7 + cam.z * 0.22));
    const d = dx * dx + dy * dy;
    const hitR = (rad + 8) * (rad + 8);
    if (d < hitR && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

// ---------- detail panel ----------
const detail = document.getElementById('detail');
function pct(v) { return Math.round((v ?? 0) * 100); }
function showDetail(n) {
  document.getElementById('dKicker').textContent =
    (n.type === 'center' ? 'you' : n.type) + (n.category ? ' · ' + n.category : '');
  document.getElementById('dTitle').textContent = n.label;
  const rows = [];
  if (n.type === 'task') {
    const cls = n.points > 0 ? 'pos' : n.points < 0 ? 'neg' : 'neu';
    rows.push(['assigned to', `${n.assigned_to}${n.assigned_type === 'agent' ? ' (agent)' : ''}`]);
    rows.push(['points', `<span class="${cls}">${n.points > 0 ? '+' : ''}${n.points}</span>`]);
    rows.push(['completions', n.completions ?? 0]);
    if (n.priority != null) rows.push(['priority', n.priority]);
  } else if (n.type !== 'center') {
    const cls = n.points > 0 ? 'pos' : n.points < 0 ? 'neg' : 'neu';
    rows.push(['tasks under', n.task_count ?? 0]);
    rows.push(['completions', n.completions ?? 0]);
    rows.push(['net points', `<span class="${cls}">${n.points > 0 ? '+' : ''}${n.points ?? 0}</span>`]);
  } else {
    rows.push(['domains', n.task_count]);
  }
  document.getElementById('dRows').innerHTML =
    rows.map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
  const w = pct(n.warmth);
  document.getElementById('dWarmTxt').textContent = w >= 95 ? 'today' : w <= 0 ? 'dormant 30d+' : w + '%';
  document.getElementById('dWarmBar').style.width = w + '%';

  // connections
  const ids = [...(nbr.get(n.id) || [])].map(i => BY.get(i)).filter(Boolean)
              .sort((a, b) => (b.warmth || 0) - (a.warmth || 0)).slice(0, 14);
  const cn = document.getElementById('dConn');
  if (ids.length) {
    cn.innerHTML = `<div class="h">connected · ${(nbr.get(n.id) || []).size}</div>` +
      ids.map(m => `<span class="chip" data-id="${m.id}">${m.label.length > 22 ? m.label.slice(0,21)+'…' : m.label}</span>`).join('');
    cn.style.display = 'block';
  } else cn.style.display = 'none';
  detail.classList.add('on');
}
document.getElementById('dConn').addEventListener('click', e => {
  const id = e.target.getAttribute('data-id'); if (id) selectNode(id);
});
document.getElementById('detailClose').addEventListener('click', () => clearSelect());

function selectNode(id, fly = true) {
  const n = BY.get(id); if (!n) return;
  selectId = id; recomputeActive(); showDetail(n);
  if (fly) {
    // fit the node + its neighborhood
    const ns = [n, ...[...neighborhood(id)].map(i => BY.get(i))].filter(Boolean);
    const bx = { minx: Math.min(...ns.map(m => m.x)), maxx: Math.max(...ns.map(m => m.x)),
                 miny: Math.min(...ns.map(m => m.y)), maxy: Math.max(...ns.map(m => m.y)) };
    if (bx.maxx - bx.minx < 30) { bx.minx -= 60; bx.maxx += 60; }
    if (bx.maxy - bx.miny < 30) { bx.miny -= 60; bx.maxy += 60; }
    fitBounds(bx, true);
  }
}
function clearSelect() {
  selectId = null; detail.classList.remove('on'); recomputeActive();
}

// ---------- search ----------
const searchEl = document.getElementById('search'), resultsEl = document.getElementById('results');
let resSel = -1, resList = [];
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { searchSet = null; resList = []; resultsEl.classList.remove('on'); recomputeActive(); return; }
  resList = NODES.filter(n => n.type !== 'center' && n.label.toLowerCase().includes(q))
                 .sort((a, b) => a.tier - b.tier || (b.warmth || 0) - (a.warmth || 0)).slice(0, 40);
  searchSet = new Set(resList.map(n => n.id));
  resSel = -1; recomputeActive(); renderResults();
});
function renderResults() {
  if (!resList.length) { resultsEl.innerHTML = '<div class="t" style="padding:4px 6px">no match</div>'; resultsEl.classList.add('on'); return; }
  resultsEl.innerHTML = resList.map((n, i) =>
    `<div data-id="${n.id}" class="${i === resSel ? 'sel' : ''}"><span class="t">[${n.type}]</span> ${n.label}</div>`).join('');
  resultsEl.classList.add('on');
}
resultsEl.addEventListener('click', e => {
  const d = e.target.closest('div[data-id]'); if (!d) return;
  searchEl.value = ''; searchSet = null; resultsEl.classList.remove('on');
  selectNode(d.getAttribute('data-id'));
});
searchEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { resSel = Math.min(resList.length - 1, resSel + 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { resSel = Math.max(0, resSel - 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'Enter' && resList.length) {
    const n = resList[Math.max(0, resSel)];
    searchEl.value = ''; searchSet = null; resultsEl.classList.remove('on');
    selectNode(n.id);
  } else if (e.key === 'Escape') { searchEl.value = ''; searchSet = null; resultsEl.classList.remove('on'); recomputeActive(); searchEl.blur(); }
});

// ---------- pointer interaction ----------
let dragging = false, moved = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
cv.addEventListener('mousedown', e => { dragging = true; moved = false; lastX = downX = e.clientX; lastY = downY = e.clientY; cv.classList.add('drag'); });
window.addEventListener('mouseup', e => {
  if (dragging && !moved) {                 // a click, not a drag
    const n = pick(e.clientX, e.clientY);
    if (n) selectNode(n.id); else clearSelect();
  }
  dragging = false; cv.classList.remove('drag');
});
window.addEventListener('mousemove', e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) moved = true;
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    target.x = cam.x; target.y = cam.y; animating = false;
    lastX = e.clientX; lastY = e.clientY;
    return;
  }
  // hover
  const n = pick(e.clientX, e.clientY);
  const id = n ? n.id : null;
  if (id !== hoverId) {
    hoverId = id; recomputeActive();
    cv.style.cursor = id ? 'pointer' : 'grab';
  }
  if (n) {
    let html = `<b>${n.label}</b>`;
    if (n.type === 'center') html += `<br><span style="color:#4a9a5a">the whole map</span>`;
    else if (n.type === 'task') {
      const c = n.score_color === 'green' ? '#3fb950' : n.score_color === 'amber' ? '#d29922' : '#e5534b';
      html += `<br><span style="color:#4a9a5a">${n.assigned_to}${n.assigned_type==='agent'?' (agent)':''} · <span style="color:${c}">growth ${n.growth_score>0?'+':''}${n.growth_score}</span> · ${n.window_completions||0}/${n.expected||'?'} this month · all-time ${n.points>0?'+':''}${n.points}</span>`;
    } else {
      const gsTxt = n.growth_score !== undefined ? ` · growth ${n.growth_score>0?'+':''}${n.growth_score}` : '';
      html += `<br><span style="color:#4a9a5a">${n.type} · ${n.task_count} task${n.task_count===1?'':'s'} · ${n.window_completions||0} this month${gsTxt}</span>`;
    }
    tip.innerHTML = html; tip.style.display = 'block';
    let tx = e.clientX + 14, ty = e.clientY + 14;
    if (tx + 310 > window.innerWidth) tx = e.clientX - 314;
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  } else tip.style.display = 'none';
});
cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; if (!dragging) { hoverId = null; recomputeActive(); } });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const wx = s2wx(e.clientX), wy = s2wy(e.clientY);
  const factor = Math.exp(-e.deltaY * 0.0016);
  const nz = Math.max(MINZ, Math.min(MAXZ, cam.z * factor));
  // keep cursor anchored
  cam.z = nz;
  cam.x = wx - (e.clientX - W / 2) / cam.z;
  cam.y = wy - (e.clientY - H / 2) / cam.z;
  target.x = cam.x; target.y = cam.y; target.z = cam.z; animating = false;
}, { passive: false });

// ---------- controls ----------
function zoomBy(f) {
  const nz = Math.max(MINZ, Math.min(MAXZ, cam.z * f));
  flyTo(cam.x, cam.y, nz, true);
}
document.getElementById('zin').onclick = () => zoomBy(1.5);
document.getElementById('zout').onclick = () => zoomBy(1 / 1.5);
document.getElementById('reset').onclick = () => { clearSelect(); searchEl.value=''; searchSet=null; resultsEl.classList.remove('on'); recomputeActive(); fitAll(true); };
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('reset').onclick(); searchEl.blur(); }
});

// ---------- resize ----------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
window.addEventListener('resize', () => { resize(); });

load();
</script>
</body>
